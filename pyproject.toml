[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech_hallucinations"
version = "0.1.0"
description = "Hallucination and distribution-shift analysis for speech foundation models"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "jiwer>=3.0.4", "requests", "tqdm"]

[project.optional-dependencies]
plots = ["matplotlib", "scikit-learn"]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
